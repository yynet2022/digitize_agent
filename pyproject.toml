[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digitize_agent"
version = "0.1.0"
description = "Agentic Plot & Document Digitization Tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.0",
    "pytesseract>=0.3.10",
    "matplotlib>=3.7.0",
    "pydantic>=2.0.0",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
digitize-agent = "digitize_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
digitize_agent = ["data/*.md"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
